[package]
name = "linbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["liangzhaoyuan12"]
mail = "liangzhaoyuan12@outlook.com"

[dependencies]
glib = "0.22"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_18", "v1_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "gzip", "deflate", "brotli", "charset", "http2"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["aes", "deflate"] }
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256"] }
dirs = "7.0.0"

[dev-dependencies]
sha2 = "0.10"
